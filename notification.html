<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>notifications</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech&display=swap" rel="stylesheet"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.png" type="image/png">
</head>
<body>
    <div id="menuOverlay" class="menu-overlay"></div>

    <div class="upbox">
       &nbsp;&nbsp;&nbsp;&nbsp;<div class="hh"> <img src="logo.png" width="70px" alt="Logo"></div>
       <span class="brand-name">AMR SAKR</span>
       <div class="upboxs">
         <button id="menuBtn" class="menu-btn" type="button" aria-label="Open menu">
           <img src="menu.png" width="60px" alt="Menu">
         </button>
       </div>
    </div>

    <aside id="sideMenu" class="side-menu" aria-label="Main menu">
      <button id="closeMenu" class="close-menu" type="button" aria-label="Close menu">×</button>
      <h2>AMR SAKR</h2>
      <a href="2.html">UPLOAD</a>
      <a href="student.html">MANAGE STUDENTS</a>
    </aside>

    <main class="hero-wrap">
      <section class="hero-card hero-split">
        <article class="hero-visual">
          <p class="eyebrow">unlock the wonders of science</p>
          <img src="logo.png" width="350px" id="mlogo" alt="AMR SAKR logo">
          <h1 class="hero-title">SEND ANNOUNCEMENT</h1>
          <p class="hero-text">THE ADMIN WEB<br></p>
        </article>

        <aside class="hero-actions">
          <div class="btn-group" style="width: 100%; display: flex; flex-direction: column; gap: 15px;">
            <div>
              <label for="gradeSelect" style="display: block; margin-bottom: 5px; color: #fff; font-weight: bold;">Select Grade:</label>
              <select id="gradeSelect" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #fff; background: rgba(0,0,0,0.5); color: #fff; box-sizing: border-box; cursor: pointer; outline: none;">
                <option value="middle1" style="background: #000; color: #fff;">Middle 1</option>
                <option value="middle2" style="background: #000; color: #fff;">Middle 2</option>
                <option value="middle3" style="background: #000; color: #fff;">Middle 3</option>
              </select>
            </div>

            <div>
              <label for="annTitle" style="display: block; margin-bottom: 5px; color: #fff; font-weight: bold;">Announcement Title:</label>
              <input type="text" id="annTitle" placeholder="Enter title..." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #fff; background: rgba(0,0,0,0.5); color: #fff; box-sizing: border-box; outline: none;">
            </div>

            <div>
              <label for="annMessage" style="display: block; margin-bottom: 5px; color: #fff; font-weight: bold;">Announcement Message:</label>
              <textarea id="annMessage" placeholder="Enter message..." style="width: 100%; height: 100px; padding: 12px; border-radius: 8px; border: 1px solid #fff; background: rgba(0,0,0,0.5); color: #fff; box-sizing: border-box; resize: vertical; outline: none;"></textarea>
            </div>

            <button id="sendBtn" class="btn" type="button" style="cursor: pointer; width: 100%;">Publish Announcement Now</button>
            <div id="statusMsg" style="text-align: center; font-weight: bold; font-size: 14px; margin-top: 5px;"></div>
          </div>
        </aside>
      </section>

      <section style="margin-top: 30px; width: 100%; background: rgba(0,0,0,0.4); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); box-sizing: border-box;">
        <h2 style="color: #fff; margin-top: 0; margin-bottom: 15px; font-size: 20px; text-align: center;">Sent Notifications</h2>
        <div id="announcementsList" style="display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto;">
          <p style="color: #aaa; text-align: center;">Loading notifications...</p>
        </div>
      </section>
    </main>

    <script>
      const menuBtn = document.getElementById('menuBtn');
      const sideMenu = document.getElementById('sideMenu');
      const overlay = document.getElementById('menuOverlay');
      const closeMenu = document.getElementById('closeMenu');

      function openMenu() {
        sideMenu.classList.add('open');
        overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
      }

      function closeMenuPanel() {
        sideMenu.classList.remove('open');
        overlay.classList.remove('show');
        document.body.style.overflow = '';
      }

      menuBtn.addEventListener('click', openMenu);
      closeMenu.addEventListener('click', closeMenuPanel);
      overlay.addEventListener('click', closeMenuPanel);

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          closeMenuPanel();
        }
      });
    </script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyA_nWn0gXXIJEvfZyZUffWQgHuywZjJmnw",
        authDomain: "swiftcart-31507.firebaseapp.com",
        projectId: "swiftcart-31507",
        storageBucket: "swiftcart-31507.firebasestorage.app",
        messagingSenderId: "937860360898",
        appId: "1:937860360898:web:6deafee28913575102295b"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const sendBtn = document.getElementById("sendBtn");
      const statusMsg = document.getElementById("statusMsg");
      const announcementsList = document.getElementById("announcementsList");

      // Send Announcement
      sendBtn.addEventListener("click", async () => {
        const grade = document.getElementById("gradeSelect").value;
        const title = document.getElementById("annTitle").value.trim();
        const message = document.getElementById("annMessage").value.trim();

        if (!title || !message) {
          statusMsg.style.color = "#ff4d4d";
          statusMsg.textContent = "Please fill in both the title and message fields.";
          return;
        }

        try {
          sendBtn.disabled = true;
          sendBtn.textContent = "Sending...";

          await addDoc(collection(db, "announcements"), {
            grade: grade,
            title: title,
            message: message,
            timestamp: Date.now()
          });

          statusMsg.style.color = "#81c784";
          statusMsg.textContent = "Announcement published successfully!";
          document.getElementById("annTitle").value = "";
          document.getElementById("annMessage").value = "";
        } catch (e) {
          console.error("Error sending announcement:", e);
          statusMsg.style.color = "#ff4d4d";
          statusMsg.textContent = "An error occurred while sending.";
        } finally {
          sendBtn.disabled = false;
          sendBtn.textContent = "Publish Announcement Now";
        }
      });

      // Real-time Fetch & Render Notifications
      const q = query(collection(db, "announcements"), orderBy("timestamp", "desc"));
      onSnapshot(q, (snapshot) => {
        announcementsList.innerHTML = "";

        if (snapshot.empty) {
          announcementsList.innerHTML = `<p style="color: #aaa; text-align: center;">No notifications sent yet.</p>`;
          return;
        }

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const id = docSnap.id;

          const item = document.createElement("div");
          item.style.cssText = "background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px;";

          item.innerHTML = `
            <div style="flex: 1; text-align: left;">
              <span style="display: inline-block; background: #fff; color: #000; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-bottom: 5px; text-transform: uppercase;">${data.grade || 'ALL'}</span>
              <h4 style="margin: 0 0 4px 0; color: #fff; font-size: 16px;">${data.title}</h4>
              <p style="margin: 0; color: #ccc; font-size: 13px;">${data.message}</p>
            </div>
            <button class="delete-btn" data-id="${id}" style="background: #ff4d4d; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; shrink: 0;">Delete</button>
          `;

          announcementsList.appendChild(item);
        });

        // Add Delete Event Listeners
        document.querySelectorAll(".delete-btn").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            const docId = e.target.getAttribute("data-id");
            if (confirm("Are you sure you want to delete this notification?")) {
              try {
                await deleteDoc(doc(db, "announcements", docId));
              } catch (err) {
                console.error("Error deleting document: ", err);
                alert("Failed to delete notification.");
              }
            }
          });
        });
      });
    </script>
</body>
</html>
