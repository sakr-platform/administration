<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Push Notification Panel</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            margin: 0; 
            padding: 40px; 
        }
        .card { 
            max-width: 500px; 
            background: #ffffff; 
            margin: auto; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h2 { 
            margin-top: 0; 
            color: #333; 
            text-align: center; 
        }
        .form-group { 
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 8px; 
            color: #555; 
        }
        input[type="text"], textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 14px; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #28a745; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.3s; 
        }
        button:hover { 
            background-color: #218838; 
        }
        .status { 
            margin-top: 15px; 
            text-align: center; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Send Push Notification to All Students</h2>

    <div class="form-group">
        <label for="title">Notification Title:</label>
        <input type="text" id="title" placeholder="e.g., Science Lesson Update">
    </div>

    <div class="form-group">
        <label for="message">Notification Message:</label>
        <textarea id="message" rows="4" placeholder="Type notification message here..."></textarea>
    </div>

    <div class="form-group">
        <label for="link">Target Link (Optional):</label>
        <input type="text" id="link" placeholder="https://yourwebsite.com">
    </div>

    <button onclick="sendNotification()">Send Notification Now</button>
    
    <div id="statusMessage" class="status"></div>
</div>

<script>
const WORKER_URL = 'https://sakr-platform.diaaabdelhady539.workers.dev';

async function sendNotification() {
    const title = document.getElementById('title').value.trim();
    const message = document.getElementById('message').value.trim();
    const link = document.getElementById('link').value.trim();
    const statusDiv = document.getElementById('statusMessage');

    if (!title || !message) {
        statusDiv.style.color = "red";
        statusDiv.innerText = "Please enter both Title and Message!";
        return;
    }

    statusDiv.style.color = "blue";
    statusDiv.innerText = "Sending notification...";

    try {
        const response = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json' 
            },
            body: JSON.stringify({ 
                grade: 'all', // بنبعت all عشان نلغي أي فلترة
                title: title, 
                message: message, 
                link: link 
            })
        });

        const result = await response.json();

        if (result.result === true || response.ok) {
            statusDiv.style.color = "green";
            statusDiv.innerText = "Notification sent successfully!";
            
            document.getElementById('title').value = '';
            document.getElementById('message').value = '';
            document.getElementById('link').value = '';
        } else {
            statusDiv.style.color = "red";
            statusDiv.innerText = "Error: " + (result.message || JSON.stringify(result));
        }
    } catch (error) {
        console.error('Error sending request:', error);
        statusDiv.style.color = "red";
        statusDiv.innerText = "Failed to communicate with worker server!";
    }
}
</script>

</body>
</html>
