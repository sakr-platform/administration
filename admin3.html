<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CHAT CONTROLS</title>
  <link rel="icon" href="logo.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" rel="stylesheet" />
  
  <style>
    /* إلغاء ومنع شريط التمرير الخارجي تماماً */
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    html::-webkit-scrollbar, body::-webkit-scrollbar {
      display: none;
    }

    body {
      background: radial-gradient(circle at top, rgba(255, 255, 255, 0.22), transparent 12%), radial-gradient(circle at 20% 20%, rgba(255, 215, 0, 0.14), transparent 18%), radial-gradient(circle at 80% 0%, rgba(124, 58, 237, 0.25), transparent 20%), linear-gradient(145deg, #04043b 0%, #06066b 30%, #01011f 65%, #00000e 100%);
      color: #fff;
      font-family: "Share Tech", sans-serif;
      padding-top: 90px;
      box-sizing: border-box;
    }

    /* 👑 البوكس العلوي الفاخر */
    .upbox {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 75px;
      background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
      border-bottom: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 1000;
    }
    .upbox .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .upbox .brand-wrap img {
      width: 50px;
      height: auto;
    }
    .upbox .brand-name {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #fff;
    }

    /* زر الإعدادات بأنيميشن سلس */
    .toggle-settings-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      font-family: "Share Tech", sans-serif;
      font-size: 14px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .toggle-settings-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }
    .toggle-settings-btn:active {
      transform: scale(0.94);
    }

    .admin-shell {
      width: min(100%, 1100px);
      margin: 0 auto;
      padding: 10px 14px;
      box-sizing: border-box;
      height: calc(100vh - 90px);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .admin-header {
      margin-bottom: 14px;
    }
    .admin-header .hero-title {
      font-size: 26px;
      margin: 0 0 4px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .admin-header .eyebrow {
      color: #ffe56b;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      margin: 0;
    }

    /* صندوق الشات الداخلي التمريري */
    .chatBox {
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 24px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.10);
      margin-bottom: 110px;
      
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 229, 107, 0.4) rgba(0, 0, 0, 0.2);
    }

    .chatBox::-webkit-scrollbar {
      width: 6px;
    }
    .chatBox::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 20px;
    }
    .chatBox::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, rgba(255, 247, 197, 0.5) 0%, rgba(255, 215, 0, 0.5) 100%);
      border-radius: 20px;
    }

    .msg-card {
      display: flex;
      flex-direction: column;
      width: 100%;
      padding: 14px 18px;
      border-radius: 20px;
      font-size: 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255,255,255,0.08);
      box-sizing: border-box;
      animation: show 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .msg-card .author {
      font-size: 14px;
      font-weight: bold;
      color: #ffe56b;
      margin-bottom: 6px;
    }
    .msg-card .content {
      word-break: break-word;
      margin-bottom: 12px;
    }
    .msg-card .replyBox {
      margin-bottom: 10px;
      padding: 10px 14px;
      background: rgba(0,0,0,0.2);
      border-radius: 14px;
      border-left: 3px solid #ffd700;
      font-size: 15px;
    }
    .msg-card .replyName {
      display: block;
      color: #ffd700;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 2px;
    }

    .media-preview-img {
      max-width: 100%;
      max-height: 260px;
      border-radius: 14px;
      margin-top: 6px;
      display: block;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .action-btn {
      font-family: "Share Tech", sans-serif;
      font-size: 13px;
      font-weight: bold;
      padding: 6px 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .action-btn:active { transform: scale(0.94); }

    .action-btn.reply { background: rgba(255,255,255,0.15); color: #fff; }
    .action-btn.reply:hover { background: rgba(255,255,255,0.3); }
    
    .action-btn.delete { background: rgba(255, 59, 59, 0.15); color: #ff8080; border: 1px solid rgba(255, 59, 59, 0.2); }
    .action-btn.delete:hover { background: #ff3b3b; color: #fff; box-shadow: 0 0 10px rgba(255, 59, 59, 0.4); }
    
    .action-btn.ban { background: rgba(255, 165, 0, 0.15); color: #ffb74d; border: 1px solid rgba(255, 165, 0, 0.2); }
    .action-btn.ban:hover { background: orange; color: #000; box-shadow: 0 0 10px rgba(255, 165, 0, 0.4); }

    #controls {
      width: 100%;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(145deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05));
      border-top: 1px solid rgba(255,255,255,0.18);
      padding: 14px 18px;
      display: flex;
      gap: 10px;
      align-items: center;
      box-sizing: border-box;
      z-index: 20;
      backdrop-filter: blur(12px);
    }

    #msgInput {
      flex: 1;
      min-height: 46px;
      border: none;
      border-radius: 26px;
      background: rgba(255,255,255,0.14);
      color: #fff;
      font-size: 16px;
      padding: 12px 16px;
      outline: none;
    }

    .hidden-file-input {
      display: none;
    }

    .controlBtn {
      min-width: 56px;
      min-height: 56px;
      border-radius: 20px;
      border: none;
      background: linear-gradient(135deg, #fff7c5 0%, #ffd700 45%, #ffbb00 100%);
      color: #06072a;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .controlBtn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3); }
    .controlBtn:active { transform: translateY(0) scale(0.95); }

    .sendButton {
      min-width: 100px;
      padding: 0 18px;
      font-size: 18px;
      font-weight: bold;
    }

    .replyPreview {
      display: none;
      position: fixed;
      bottom: 180px; left: 20px; right: 20px;
      z-index: 20;
      background: rgba(10,10,20,0.95);
      border-left: 6px solid #ffe56b;
      border-radius: 20px;
      padding: 14px 20px;
    }
    .replyPreviewTitle { color: #ffe56b; font-size: 16px; margin-bottom: 6px; }
    .replyPreviewText { font-size: 15px; color: #fff; }
    #cancelReply { position: absolute; right: 16px; top: 14px; font-size: 20px; color: #ff6b6b; cursor: pointer; }

    /* ⚙️ نافذة الإعدادات المنبثقة التفاعلية */
    .settings-section {
      display: none;
      position: fixed;
      top: 90px; right: 20px;
      width: min(90%, 350px);
      max-height: 65vh;
      overflow-y: auto;
      background: rgba(10, 10, 26, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 20px;
      z-index: 999;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(15px);
      animation: show 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }
    .settings-section h3 {
      margin: 0 0 18px;
      color: #ffe56b;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .settings-btn-danger {
      width: 100%;
      background: rgba(255, 59, 59, 0.15);
      color: #ff8080;
      border: 1px solid rgba(255, 59, 59, 0.3);
      padding: 12px;
      border-radius: 14px;
      font-family: "Share Tech", sans-serif;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .settings-btn-danger:hover {
      background: #ff3b3b;
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 59, 59, 0.4);
    }

    /* 🛡️ صندوق التحقق (الكابتشا) */
    .captcha-box {
      display: none;
      margin-top: 16px;
      padding: 14px;
      background: rgba(255,255,255,0.05);
      border-radius: 14px;
      border: 1px dashed rgba(255,255,255,0.2);
    }
    .captcha-code {
      display: inline-block;
      background: linear-gradient(135deg, #ffd700, #ffbb00);
      color: #000;
      padding: 6px 14px;
      font-weight: bold;
      font-size: 20px;
      letter-spacing: 4px;
      border-radius: 8px;
      margin-bottom: 10px;
      user-select: none;
    }
    .captcha-input {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 12px;
      border-radius: 8px;
      color: #fff;
      font-family: "Share Tech", sans-serif;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
      text-transform: uppercase;
    }
    .captcha-confirm-btn {
      width: 100%;
      margin-top: 10px;
      background: #ff3b3b;
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-family: "Share Tech", sans-serif;
      font-weight: bold;
      cursor: pointer;
    }

    /* 🚫 قائمة المستخدمين المحظورين داخل المنيو */
    .banned-title-inside {
      color: #ff6b6b;
      font-size: 15px;
      margin: 20px 0 10px;
      text-transform: uppercase;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 15px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .banned-user-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .banned-user-row .username {
      color: #ffb74d;
      font-weight: bold;
      font-size: 15px;
    }
    .unban-btn {
      background: rgba(64, 99, 255, 0.2);
      color: #9cb2ff;
      border: 1px solid rgba(64, 99, 255, 0.4);
      padding: 6px 12px;
      border-radius: 8px;
      font-family: "Share Tech", sans-serif;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .unban-btn:hover {
      background: #4063ff;
      color: #fff;
      box-shadow: 0 0 10px rgba(64, 99, 255, 0.4);
    }

    @keyframes show {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 750px) {
      body { padding-bottom: 230px; }
      .sendButton { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="upbox">
    <div class="brand-wrap">
      <img src="logo.png" alt="Logo">
      <span class="brand-name">AMR SAKR</span>
    </div>
    <button class="toggle-settings-btn" onclick="toggleSettings()"><span class="material-symbols-rounded" style="font-size:18px;">settings</span>Settings</button>
  </div>

  <main class="admin-shell">
    <header class="admin-header">
      <p class="eyebrow">MIDDLE 1</p>
      <h1 class="hero-title">Admin Control Panel</h1>
    </header>

    <div id="chatBox" class="chatBox"></div>

    <!-- ⚙️ قسم الإعدادات -->
    <section id="settingsSection" class="settings-section">
      <h3>⚙️ Chat Settings</h3>
      <button class="settings-btn-danger" onclick="showCaptchaBox()">Clear All Chat</button>
      
      <!-- صندوق التحقق بالكود العشوائي -->
      <div id="captchaBox" class="captcha-box">
        <label style="display:block; font-size:13px; color:#aaa; margin-bottom:6px;">Enter the code below to confirm deletion:</label>
        <div id="captchaCode" class="captcha-code">-----</div>
        <input type="text" id="captchaInput" class="captcha-input" placeholder="Type code here..." autocomplete="off">
        <button class="captcha-confirm-btn" onclick="verifyAndClearChat()">Confirm Delete</button>
      </div>

      <!-- 🚫 قائمة الـ Banned المستدعاة هنا تلقائياً -->
      <div class="banned-title-inside">🚫 Banned Users List</div>
      <div id="bannedUsersList"></div>
    </section>
  </main>

  <div class="replyPreview" id="replyPreview">
    <div id="cancelReply" onclick="cancelReply()">✖</div>
    <div class="replyPreviewTitle" id="replyPreviewName"></div>
    <div class="replyPreviewText" id="replyPreviewText"></div>
  </div>

  <div id="controls">
    <input id="msgInput" placeholder="    Type an admin message..." autocomplete="off">
    
    <input type="file" id="imageInput" class="hidden-file-input" accept="image/*" onchange="uploadImageBase64(this)">
    <button id="uploadBtn" class="controlBtn" onclick="document.getElementById('imageInput').click()"><span class="material-symbols-rounded">image</span></button>
    
    <button id="sendBtn" class="controlBtn sendButton" onclick="sendMsg()">Send</button>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, setDoc, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_aNwWSJ7oQG9gNapKHDATCgOTPx5fUiQ",
  authDomain: "chat3-ec732.firebaseapp.com",
  projectId: "chat3-ec732",
  storageBucket: "chat3-ec732.firebasestorage.app",
  messagingSenderId: "769831931294",
  appId: "1:769831931294:web:d972f94dfdcd07f3e3da8f"
};



const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const adminName = "Admin"; 

// فتح وإغلاق قائمة الإعدادات
window.toggleSettings = function() {
  const section = document.getElementById("settingsSection");
  if (section.style.display === "block") {
    section.style.display = "none";
    document.getElementById("captchaBox").style.display = "none"; // إخفاء بوكس الكابتشا عند الإغلاق
  } else {
    section.style.display = "block";
  }
};

let currentCaptcha = "";

// إنشاء وعرض كود الكابتشا العشوائي المكون من 5 حروف
window.showCaptchaBox = function() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // استبعاد الحروف المتشابهة مثل O و 0
  let code = "";
  for (let i = 0; i < 5; i++) {
    code += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  currentCaptcha = code;
  
  document.getElementById("captchaCode").innerText = currentCaptcha;
  document.getElementById("captchaInput").value = "";
  document.getElementById("captchaBox").style.display = "block";
};

// التحقق من الكود وحذف الشات
window.verifyAndClearChat = async function() {
  const userInput = document.getElementById("captchaInput").value.trim().toUpperCase();
  
  if (userInput !== currentCaptcha) {
    alert("Incorrect code! Please try again.");
    showCaptchaBox(); // تحديث الكود في حال الخطأ لحماية إضافية
    return;
  }
  
  if (confirm("Are you absolutely sure you want to wipe ALL chat history? This cannot be undone.")) {
    try {
      const querySnapshot = await getDocs(collection(db, "messages"));
      const deletePromises = [];
      
      querySnapshot.forEach((documentDoc) => {
        deletePromises.push(deleteDoc(doc(db, "messages", documentDoc.id)));
      });
      
      await Promise.all(deletePromises);
      alert("Chat has been successfully cleared!");
      
      // إخفاء القوائم بعد الحذف بنجاح
      document.getElementById("captchaBox").style.display = "none";
      document.getElementById("settingsSection").style.display = "none";
    } catch (err) {
      alert("Error clearing chat: " + err.message);
    }
  }
};

let replyData = null;

window.setReply = function(name, text) {
  replyData = { name, text };
  const preview = document.getElementById("replyPreview");
  if (preview) {
    preview.style.display = "block";
    document.getElementById("replyPreviewName").innerText = "Reply to: " + name;
    document.getElementById("replyPreviewText").innerText = text;
  }
};

window.cancelReply = function() {
  replyData = null;
  const preview = document.getElementById("replyPreview");
  if (preview) preview.style.display = "none";
};

// دالة لمعالجة وضغط الصورة برمجياً
function compressImage(file, maxWidth, maxHeight, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxWidth) {
            height *= maxWidth / width;
            width = maxWidth;
          }
        } else {
          if (height > maxHeight) {
            width *= maxHeight / height;
            height = maxHeight;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve(dataUrl);
      };
      img.onerror = error => reject(error);
    };
    reader.onerror = error => reject(error);
  });
}

// رفع الصور الفوري بـ Base64
window.uploadImageBase64 = async function(element) {
  const file = element.files[0];
  if (!file) return;

  const uploadBtn = document.getElementById("uploadBtn");
  const originalHTML = uploadBtn.innerHTML;
  uploadBtn.innerHTML = `<span class="material-symbols-rounded">hourglass_empty</span>`;
  uploadBtn.disabled = true;

  try {
    const compressedBase64 = await compressImage(file, 1000, 1000, 0.7);

    await addDoc(collection(db, "messages"), {
      name: adminName,
      text: "",
      imageBase64: compressedBase64, 
      time: serverTimestamp(),
      reply: replyData ? { name: replyData.name, text: replyData.text } : null
    });
    cancelReply();
  } catch (err) {
    alert("خطأ أثناء الرفع إلى قاعدة البيانات: " + err.message);
  } finally {
    uploadBtn.innerHTML = originalHTML;
    uploadBtn.disabled = false;
    element.value = ""; 
  }
};

// إرسال النص
window.sendMsg = async function() {
  const input = document.getElementById("msgInput");
  if (!input.value.trim()) return;

  await addDoc(collection(db, "messages"), {
    name: adminName,
    text: input.value,
    imageBase64: null,
    time: serverTimestamp(),
    reply: replyData ? { name: replyData.name, text: replyData.text } : null
  });

  input.value = "";
  cancelReply();
};

document.getElementById("msgInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    sendMsg();
  }
});

window.deleteMsg = async function(id) {
  if(confirm("Are you sure you want to completely delete this message?")) {
    await deleteDoc(doc(db, "messages", id));
  }
};

window.banUser = async function(user, rawMessage) {
  if(user === adminName) {
    alert("You cannot ban the admin system!");
    return;
  }
  if(confirm(`Are you sure you want to ban ${user}?`)) {
    const reasonText = rawMessage || "Sent an image or attachment.";
    await setDoc(doc(db, "bannedUsers", user), { 
      banned: true,
      reason: reasonText 
    });
    alert("Banned user: " + user);
  }
};

// دالة فك الحظر Unban
window.unbanUser = async function(user) {
  if(confirm(`Are you sure you want to unban ${user}?`)) {
    await deleteDoc(doc(db, "bannedUsers", user));
    alert("Unbanned user: " + user);
  }
};

// مراقبة وعرض المستخدمين المحظورين بشكل حي وتلقائي
onSnapshot(collection(db, "bannedUsers"), (snapshot) => {
  const bannedBox = document.getElementById("bannedUsersList");
  if (!bannedBox) return;
  bannedBox.innerHTML = "";
  
  if(snapshot.empty) {
    bannedBox.innerHTML = `<div style="color:#aaa; font-size:13px; text-align:center; padding: 10px;">No banned users found.</div>`;
    return;
  }

  snapshot.forEach((d) => {
    const user = d.id;
    const div = document.createElement("div");
    div.className = "banned-user-row";
    div.innerHTML = `
      <span class="username">${user}</span>
      <button class="unban-btn" onclick="unbanUser('${user}')">Unban</button>
    `;
    bannedBox.appendChild(div);
  });
});

const q = query(collection(db, "messages"), orderBy("time"));
onSnapshot(q, { includeMetadataChanges: true }, (snapshot) => {
  const box = document.getElementById("chatBox");
  box.innerHTML = "";
  const messages = [];

  snapshot.forEach(d => {
    const data = d.data();
    if (!data.time) {
      data.time = Date.now();
    }
    messages.push({ id: d.id, ...data });
  });

  messages.forEach(data => {
    const div = document.createElement("div");
    div.className = "msg-card";

    let replyHTML = "";
    if (data.reply) {
      replyHTML = `
        <div class="replyBox">
          <span class="replyName">Reply to ${data.reply.name}</span>
          ${data.reply.text}
        </div>
      `;
    }

    let content = "";
    if (data.imageBase64) {
      content = `<img src="${data.imageBase64}" class="media-preview-img" alt="Uploaded Image">`;
    } else {
      content = `<div>${data.text}</div>`;
    }

    const escapedMessage = data.text ? data.text.replace(/'/g, "\\'") : "";

    div.innerHTML = `
      <span class="author">${data.name}</span>
      <div class="content">
        ${content}
        ${replyHTML}
      </div>
      <div class="action-row">
        <button class="action-btn reply" onclick="setReply('${data.name}','${data.text || "[Image]"}' )">Reply</button>
        <button class="action-btn delete" onclick="deleteMsg('${data.id}')">Delete</button>
        <button class="action-btn ban" onclick="banUser('${data.name}', '${escapedMessage}')">Ban User</button>
      </div>
    `;
    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
});
</script>

</body>
</html>
